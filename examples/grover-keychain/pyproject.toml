[project]
name = "grover-keychain"
version = "2.0.0"
description = "Grover & Pals four-color keychain: the brand logo as a relief, URL inlaid on the back"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d==0.13.0",
    "cadkit",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "scipy>=1.14",
    "segno>=1.6.6",
    "shapely>=2.0",
]

[tool.uv.sources]
cadkit = { path = "../../cadkit", editable = true }

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8",
    "pytest-xdist>=3.8",
]

[tool.pytest.ini_options]
markers = ["slow: drives Bambu Studio's CLI; skipped when it isn't installed"]
pythonpath = ["."]
testpaths = ["tests"]
