[project]
name = "lily-of-the-valley"
version = "0.1.0"
description = "Lily of the valley wall flower: an arching sprig of white bells, green and white PLA, no supports"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d==0.13.0",
    "cadkit[render]",
    "manifold3d>=3.5.4",
]

[tool.uv.sources]
cadkit = { path = "../../cadkit", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
markers = ["slow: drives Bambu Studio's CLI; skipped when it isn't installed"]
pythonpath = ["."]
testpaths = ["tests"]
