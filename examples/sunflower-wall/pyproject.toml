[project]
name = "sunflower"
version = "0.1.0"
description = "Sunflower wall decor: 400 mm, arched petals in 8 quarter prints, a one-piece seed head, snap pins"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d==0.13.0",
    "cadkit[render]",
    "scipy>=1.18.1",
]

[tool.uv.sources]
cadkit = { path = "../../cadkit", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
markers = ["slow: writes every plate or drives Bambu Studio's CLI (minutes); skip with -m 'not slow'"]
pythonpath = ["."]
testpaths = ["tests"]
