[project]
name = "remote-cover"
version = "0.1.0"
description = "HEXBUG remote battery cover: a screwless replacement held by a press-fit plug in the screw indent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d==0.13.0",
    "cadkit[render]",
]

[tool.uv.sources]
cadkit = { path = "../../cadkit", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
markers = ["slow: drives Bambu Studio's CLI; skipped when it isn't installed"]
pythonpath = ["."]
testpaths = ["tests"]
