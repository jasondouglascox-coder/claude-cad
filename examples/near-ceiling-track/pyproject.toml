[project]
name = "hotrain"
version = "0.1.0"
description = "Parametric 3D-printable HO arch-deck ceiling shelf"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d==0.13.0",
    "cadkit[viewer,render]",
    "ocp-viewer>=1.1.3",
]

[tool.uv.sources]
cadkit = { path = "../../cadkit", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
markers = ["slow: whole-room, whole-corner, all-plates and file-writing checks (minutes each); skip with -m 'not slow'"]
pythonpath = ["."]
testpaths = ["tests"]
