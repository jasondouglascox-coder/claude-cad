[project]
name = "cat-decals"
version = "0.1.0"
description = "Little cat silhouettes in a dozen poses, cut from black vinyl on a Silhouette Cameo: DXF sheets for a 24x24 mat"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ezdxf>=1.3",
    "matplotlib>=3.9",
    "numpy>=2",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
