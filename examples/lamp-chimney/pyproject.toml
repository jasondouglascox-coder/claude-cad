[project]
name = "lamp-chimney"
version = "0.1.0"
description = "White one-line-wall replacement chimney for an LED oil-lamp-style lamp"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d==0.13.0",
    "cadkit[render]",
]

[tool.uv.sources]
cadkit = { path = "../../cadkit", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
markers = ["slow: drives Bambu Studio's CLI; skipped when it isn't installed"]
pythonpath = ["."]
testpaths = ["tests"]
