[project]
name = "cadkit"
version = "0.1.0"
description = "Print-ready output for build123d parts: Bambu Studio project 3MF, plate packing, two-color parts, print checks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d==0.13.0",
    "numpy",
]

[project.optional-dependencies]
viewer = ["ocp-viewer>=1.1.3"]
render = ["numba", "pillow"]  # cadkit.render: shaded PNG previews
mesh = [
    "manifold3d>=3.5.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "numba",
    "pillow",
    "manifold3d>=3.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadkit"]

[tool.pytest.ini_options]
markers = ["slow: drives a real slicer (Bambu Studio); skipped when it isn't installed"]
testpaths = ["tests"]
