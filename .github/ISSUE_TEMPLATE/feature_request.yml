name: Feature request
description: A cadkit helper, a new print check, a skill improvement, or a new example
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to design or print, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd add or change. API sketches, drawings and links are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, or how you work around it now.
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I'd like to open the PR for this.
